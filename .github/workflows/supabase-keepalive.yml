name: Supabase keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm API (keeps Supabase active)
        env:
          WARM_URL: ${{ secrets.WARM_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$WARM_URL" ]; then
            echo "Missing GitHub secret WARM_URL" >&2
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secret CRON_SECRET" >&2
            exit 1
          fi

          response=$(curl -s -w "\n%{http_code}" -X GET "$WARM_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "User-Agent: github-actions-supabase-keepalive")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [ "$http_code" -ge 400 ]; then
            echo "Request failed with status $http_code"
            echo "Response body: $body"
            exit 1
          fi

          echo "Success: $http_code"
